<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographer Showcase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Photographer Logo">
    </div>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#gallery">Gallery</a></li>
      </ul>
    </nav>
  </header>

  <section id="home" class="hero">
    <h1>Welcome to My Photography World</h1>
    <p>Capturing moments that last a lifetime.</p>
    <a href="#gallery" class="btn">View Gallery</a>
  </section>

  <section id="about" class="about">
    <h2>About Me</h2>
    <p>Hi, I'm Mustapha elfersioui, i'm a photographer passionate . With over 10 years of experience, I strive to capture the essence of every moment.</p>
  </section>

  <section id="gallery" class="gallery">
    <h2>Gallery</h2>
    <div class="gallery-grid">
      <img src="images/photo1.jpg" alt="Photo 1">
      <img src="images/photo2.jpg" alt="Photo 2">
      <img src="images/photo3.jpg" alt="Photo 3">
      <img src="images/photo4.jpg" alt="Photo 4">
      <img src="images/photo5.jpg" alt="Photo 5">
      <img src="images/photo6.jpg" alt="Photo 6">
      <img src="images/photo7.jpg" alt="Photo 7">
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
