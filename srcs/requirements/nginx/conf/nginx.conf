# Define the user and group under which the worker processes will run.
user  nginx;
worker_processes  auto;

# Error log file location and log level.
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Events block defines the parameters that affect connection processing.
events {
    worker_connections  1024;  # Maximum number of simultaneous connections per worker.
}

# HTTP block defines the parameters for HTTP and HTTPS servers.
http {
    include       /etc/nginx/mime.types;  # Include MIME types for file handling.
    default_type  application/octet-stream;  # Default MIME type for unknown files.

    # Log format for access logs.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;  # Access log file location.

    sendfile        on;  # Enable efficient file transfer.
    #tcp_nopush     on;  # Uncomment to enable TCP_NOPUSH option.

    keepalive_timeout  65;  # Timeout for keep-alive connections.

    #gzip  on;  # Uncomment to enable gzip compression.

    # Define a server block for handling HTTP requests.

	server {
		listen 80;
		server_name melfersi.42.fr;
		
		return 301 https://$host$request_uri;
	}

    server {
        listen       443 ssl;  # Listen on port 443.
        server_name  melfersi.42.fr;  # Server name (can be a domain name or IP address)

		# SSL configuration.
		ssl_certificate /etc/ssl/certs/melfersi.42.fr.crt;
		ssl_certificate_key /etc/ssl/private/melfersi.42.fr.key;

		ssl_protocols TLSv1.2 TLSv1.3;

        root   /var/www/html;  # Root directory for serving files.
        index  index.html index.php;  # Default index files.
        # Location block for handling requests to the root URL.
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Uncomment to deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one.
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
	

    # Uncomment to include additional configuration files.
    #include /etc/nginx/conf.d/*.conf;
}